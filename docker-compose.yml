services:

  mysql:
    image: mysql:8.0
    restart: always
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - storage_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5

  rails:
    build: .
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DB_HOST: mysql
    networks:
      - app_network
      - storage_network

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rails
    networks:
      - public
      - app_network
        

volumes:
  mysql_data:

networks:
  public:
  app_network:
  storage_network:
  monitoring_network: 