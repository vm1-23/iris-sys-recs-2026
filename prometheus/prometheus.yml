global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "rails"
    dns_sd_configs:
      - names:
          - "rails"
        type: A
        port: 3000